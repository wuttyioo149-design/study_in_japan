<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institution Details | Study in Japan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="Study in Japan home">
          <img class="brand-logo" src="images/logo-navbar.png" alt="Study in Japan - Discover your future" />
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="index.html">Home</a>
          <a href="schools.html">Schools</a>
          <a href="#contact">Contact</a>
          <div class="language-switch" aria-label="Language">
            <button type="button" data-language="en" aria-pressed="false">EN</button>
            <button type="button" data-language="ja" aria-pressed="false">日本語</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="detail-main">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span>&rsaquo;</span>
          <a href="schools.html">Schools</a>
          <span>&rsaquo;</span>
          <span id="breadcrumb-name" data-i18n="institution">Institution</span>
        </nav>

        <section class="detail-card">
          <img class="detail-image" id="institution-image" src="images/placeholder.svg" alt="" />
          <div class="detail-info">
            <span class="type-pill" id="institution-type-pill">University</span>
            <h1 id="institution-name" data-i18n="loadingInstitution">Loading institution...</h1>
            <p class="detail-japanese" id="institution-japanese-name"></p>
            <dl class="fact-list">
              <div>
                <dt>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.1 7-11a7 7 0 0 0-14 0c0 5.9 7 11 7 11Z" /><circle cx="12" cy="10" r="2.5" /></svg>
                  <span data-i18n="location">Location</span>
                </dt>
                <dd id="institution-location"></dd>
              </div>
              <div>
                <dt>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-5 8 5" /><path d="M6 10v8" /><path d="M10 10v8" /><path d="M14 10v8" /><path d="M18 10v8" /><path d="M4 18h16" /></svg>
                  <span data-i18n="type">Type</span>
                </dt>
                <dd id="institution-type"></dd>
              </div>
              <div>
                <dt>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z" /><path d="m9.5 12 1.8 1.8 3.7-4" /></svg>
                  <span data-i18n="ownership">Ownership</span>
                </dt>
                <dd id="institution-ownership"></dd>
              </div>
              <div>
                <dt>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c2.2 2.5 3.3 5.5 3.3 9S14.2 18.5 12 21" /><path d="M12 3c-2.2 2.5-3.3 5.5-3.3 9S9.8 18.5 12 21" /></svg>
                  <span data-i18n="englishPrograms">English Programs</span>
                </dt>
                <dd id="institution-english"></dd>
              </div>
              <div>
                <dt>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z" /><path d="M7 11v4.5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V11" /><path d="M21 8v6" /></svg>
                  <span data-i18n="scholarshipAvailable">Scholarship Available</span>
                </dt>
                <dd id="institution-scholarship"></dd>
              </div>
            </dl>
          </div>
        </section>

        <section class="about-card">
          <h2>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-5 8 5" /><path d="M6 10v8" /><path d="M10 10v8" /><path d="M14 10v8" /><path d="M18 10v8" /><path d="M4 18h16" /></svg>
            <span data-i18n="aboutUniversity">About the University</span>
          </h2>
          <p id="institution-description" data-i18n="loadingDetails">Loading details...</p>
        </section>

        <section class="majors-section">
          <h2 data-i18n="majorsOffered">Majors Offered</h2>
          <div class="majors-list" id="majors-list" aria-live="polite"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer" id="contact">
      <div class="container footer-grid">
        <div class="footer-brand">
          <div class="brand footer-logo">
            <img class="brand-logo footer-logo-image" src="images/logo-white.png" alt="Study in Japan - Discover your future" />
          </div>
        </div>
        <address class="footer-contact">
          <a href="mailto:info@studyinjapan.jp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" /><path d="m4 7 8 6 8-6" /></svg>
            info@studyinjapan.jp
          </a>
          <a href="tel:+81312345678">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2.1Z" /></svg>
            +81 3-1234-5678
          </a>
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg>
            Tokyo, Japan
          </span>
        </address>
      </div>
    </footer>

    <script src="js/language.js"></script>
    <script src="js/institution.js"></script>
  </body>
</html>
